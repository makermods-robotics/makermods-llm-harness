[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "makermods-llm-harness"
version = "0.1.0"
description = "Let an LLM move a Metal or Maker arm: tool targets in, camera images and joint state out, behind a table-floor safety envelope"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
  "metal-arm @ git+https://github.com/makermods-robotics/metal-arm-sdk",
  "maker-arm @ git+https://github.com/makermods-robotics/maker-arm-sdk",
  "numpy",
  "opencv-python",
  "pyyaml",
]

[project.scripts]
llm-harness = "makermods_llm_harness.cli:main"

[project.optional-dependencies]
mujoco = ["mujoco>=3.1"]
mcp = ["mcp>=2"]
agent = ["anthropic>=2"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
